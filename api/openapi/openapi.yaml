components:
    schemas:
        Backup:
            type: object
            properties:
                id:
                    type: string
                tenant_id:
                    type: string
                instance_id:
                    type: string
                method_id:
                    type: string
                state:
                    enum:
                        - BACKUP_STATE_UNSPECIFIED
                        - BACKUP_STATE_PENDING
                        - BACKUP_STATE_RUNNING
                        - BACKUP_STATE_SUCCEEDED
                        - BACKUP_STATE_FAILED
                        - BACKUP_STATE_CANCELED
                        - BACKUP_STATE_EXPIRED
                        - BACKUP_STATE_UNKNOWN
                    type: string
                    format: enum
                size_bytes:
                    type: string
                checksum:
                    $ref: '#/components/schemas/Checksum'
                started_at:
                    type: string
                    format: date-time
                completed_at:
                    type: string
                    format: date-time
                duration:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                consistency_point:
                    type: string
                    format: date-time
                expires_at:
                    type: string
                    format: date-time
                artifact:
                    $ref: '#/components/schemas/ObjectRef'
                error_message:
                    type: string
                verification:
                    allOf:
                        - $ref: '#/components/schemas/Verification'
                    description: Most recent verification of this backup, if any.
                triggered_manually:
                    type: boolean
                origin:
                    enum:
                        - BACKUP_ORIGIN_UNSPECIFIED
                        - BACKUP_ORIGIN_MANAGED
                        - BACKUP_ORIGIN_OBSERVED
                    type: string
                    description: |-
                        Who took this backup. Managed backups carry a manifest Fleetward captured and can be verified;
                         observed ones are evidence about somebody else's backup and cannot (ADR-0015). The two must
                         never be rendered as the same green tick.
                    format: enum
                external_id:
                    type: string
                    description: The identifier the engine gave this backup, where the engine assigns one. Empty otherwise.
                external_location:
                    type: string
                    description: |-
                        Where the artifact is, as the engine names it. Set on observed backups, which Fleetward does
                         not own; managed backups carry `artifact` instead.
                evidence:
                    allOf:
                        - $ref: '#/components/schemas/ObservedEvidence'
                    description: 'Only meaningful on an observed backup: what its evidence could and could not establish.'
        BackupHistoryCapabilities:
            type: object
            properties:
                supported:
                    type: boolean
                    description: ListBackupHistory returns evidence rather than ERROR_CODE_UNSUPPORTED.
                source_description:
                    type: string
                    description: |-
                        Where the evidence comes from, in the engine's own vocabulary, so a report can say what it is
                         reading. Display only — core must not branch on it.
                identity_is_engine_assigned:
                    type: boolean
                    description: |-
                        ObservedBackup.external_id is an identifier the engine itself assigns, and therefore survives
                         an artifact being moved or renamed. When false the plugin derives it from what it can see, so a
                         renamed artifact may appear as a second backup, and Fleetward says so rather than double
                         counting silently.
                reports_outcome:
                    type: boolean
                    description: |-
                        The evidence distinguishes a successful backup from a failed one. When false every record is
                         OBSERVED_OUTCOME_UNKNOWN, and nothing downstream may render one as a success.
                requires_shared_directory:
                    type: boolean
                    description: |-
                        Observation reads the directory of ADR-0026, so core refuses an observation schedule against an
                         instance that has none — the same precondition BackupMethod.requires_shared_directory carries.
            description: |-
                BackupHistoryCapabilities declares what a plugin can observe of backups it did not take.

                 The fields are not decoration. Two engines' evidence differ in what they can actually prove: a
                 history table the engine maintains records an outcome and an identity that survives anything; a
                 directory listing records that a file exists. Presenting those as the same green tick is exactly
                 the false confidence this product exists to eliminate, so what each source can and cannot support
                 is declared here and core reports accordingly.
        BackupMethod:
            type: object
            properties:
                id:
                    type: string
                    description: Stable identifier referenced by BackupRequest.method_id, e.g. "pg_basebackup", "mysqldump".
                display_name:
                    type: string
                description:
                    type: string
                kind:
                    enum:
                        - BACKUP_KIND_UNSPECIFIED
                        - BACKUP_KIND_PHYSICAL
                        - BACKUP_KIND_LOGICAL
                        - BACKUP_KIND_SNAPSHOT
                    type: string
                    format: enum
                is_default:
                    type: boolean
                    description: Exactly one method per plugin should set this.
                enables_pitr:
                    type: boolean
                    description: Backups taken with this method can serve as a PITR baseline.
                supports_incremental:
                    type: boolean
                supports_compression:
                    type: boolean
                supports_parallelism:
                    type: boolean
                requires_downtime:
                    type: boolean
                    description: The instance must be offline or locked for the duration. Core warns loudly before scheduling.
                required_tools:
                    type: array
                    items:
                        type: string
                options:
                    type: array
                    items:
                        $ref: '#/components/schemas/MethodOption'
                requires_shared_directory:
                    type: boolean
                    description: |-
                        This method's tooling writes the artifact to the database server's own filesystem rather than
                         to a stream, so it needs a directory the engine and the plugin can both reach (ADR-0026). Core
                         refuses to schedule this method against an instance that has none, naming what is missing,
                         rather than discovering it at 02:00.
        BackupSummary:
            type: object
            properties:
                last_backup_at:
                    type: string
                    format: date-time
                last_backup_state:
                    enum:
                        - BACKUP_STATE_UNSPECIFIED
                        - BACKUP_STATE_PENDING
                        - BACKUP_STATE_RUNNING
                        - BACKUP_STATE_SUCCEEDED
                        - BACKUP_STATE_FAILED
                        - BACKUP_STATE_CANCELED
                        - BACKUP_STATE_EXPIRED
                        - BACKUP_STATE_UNKNOWN
                    type: string
                    format: enum
                last_verification_at:
                    type: string
                    format: date-time
                last_verification_status:
                    enum:
                        - VERIFICATION_STATUS_UNSPECIFIED
                        - VERIFICATION_STATUS_VERIFIED
                        - VERIFICATION_STATUS_FAILED
                        - VERIFICATION_STATUS_INCONCLUSIVE
                    type: string
                    format: enum
                last_backup_id:
                    type: string
            description: |-
                BackupSummary is the two-part status the estate grid shows: did the backup succeed, and was it
                 proven restorable. These are deliberately separate — a green backup with a red verification is
                 the most dangerous state in the product and must never collapse into one indicator.

                 Deprecated: see Instance.backup_summary. Superseded by GetBackupAdherence.
        Capabilities:
            type: object
            properties:
                engine_type:
                    type: string
                    description: |-
                        Canonical engine identifier, e.g. "postgresql", "mysql", "mariadb", "mongodb", "redis".
                         Used for display, sandbox image resolution, and grouping only — never for behavioral branching
                         in core.
                engine_display_name:
                    type: string
                plugin_version:
                    type: string
                contract_version:
                    type: string
                    description: Version of this contract the plugin was built against, e.g. "v1".
                supported_engine_versions:
                    type: array
                    items:
                        type: string
                    description: Engine versions this plugin is known to support, as semver ranges, e.g. ">=13 <17".
                supports_pitr:
                    type: boolean
                    description: Point-in-time recovery is available for instances of this engine.
                supports_schema_discovery:
                    type: boolean
                    description: The engine has a schema/database hierarchy worth discovering and displaying.
                supports_config_read:
                    type: boolean
                    description: GetConfig returns meaningful data.
                supports_replication:
                    type: boolean
                    description: The engine has a replication topology Discover can report.
                supports_replication_lag:
                    type: boolean
                    description: |-
                        Replication lag can be measured and is emitted as a metric. Core gates the lag health rule and
                         the UI's lag column on this flag.
                supports_storage_metrics:
                    type: boolean
                    description: Storage utilization metrics are available, enabling the "storage > 85%" alert rule.
                supports_online_backup:
                    type: boolean
                    description: At least one backup method runs without taking the instance offline.
                supports_sandbox_restore:
                    type: boolean
                    description: |-
                        Restore into a sandbox is possible. Automated backup verification requires this; without it
                         core can back up but will report verification as unsupported rather than failed.
                supports_point_in_time_restore:
                    type: boolean
                    description: Restore can target a point in time, not just the artifact's own consistency point.
                backup_methods:
                    type: array
                    items:
                        $ref: '#/components/schemas/BackupMethod'
                principal_model:
                    enum:
                        - PRINCIPAL_MODEL_UNSPECIFIED
                        - PRINCIPAL_MODEL_USERS
                        - PRINCIPAL_MODEL_USERS_AND_ROLES
                        - PRINCIPAL_MODEL_USERS_AND_GRANTS
                        - PRINCIPAL_MODEL_ACL
                        - PRINCIPAL_MODEL_NONE
                    type: string
                    format: enum
                supported_verification_checks:
                    type: array
                    items:
                        enum:
                            - VERIFICATION_CHECK_UNSPECIFIED
                            - VERIFICATION_CHECK_CONNECTIVITY
                            - VERIFICATION_CHECK_RECORD_COUNTS
                            - VERIFICATION_CHECK_SCHEMA_PRESENCE
                            - VERIFICATION_CHECK_INTEGRITY
                            - VERIFICATION_CHECK_QUERYABILITY
                        type: string
                        format: enum
                    description: Verification checks this plugin implements. Core requests a subset of these.
                metrics:
                    type: array
                    items:
                        $ref: '#/components/schemas/MetricDescriptor'
                    description: Metrics this plugin may emit, so core can register them without a collection round-trip.
                sandbox_template:
                    allOf:
                        - $ref: '#/components/schemas/SandboxTemplate'
                    description: |-
                        How to provision a sandbox for this engine. Core's SandboxProvider consumes this and stays
                         engine-agnostic.
                required_tools:
                    type: array
                    items:
                        type: string
                    description: |-
                        External executables the plugin needs on its PATH, e.g. "pg_basebackup". Core surfaces missing
                         tools as a plugin health problem rather than letting a backup fail at 3am.
                backup_history:
                    allOf:
                        - $ref: '#/components/schemas/BackupHistoryCapabilities'
                    description: |-
                        What this plugin can see of backups Fleetward did not take (ADR-0015). Engines differ
                         enormously, so this is a declaration rather than an assumption core may make.
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                    description: Display-only metadata. Core must not branch on these.
            description: |-
                Capabilities is the typed feature matrix that core and the UI branch on. Declaring a capability
                 the plugin does not actually implement is the one defect that will get a plugin rejected: core
                 trusts this matrix when deciding what is safe to do to a production database.
        CheckResult:
            type: object
            properties:
                check:
                    enum:
                        - VERIFICATION_CHECK_UNSPECIFIED
                        - VERIFICATION_CHECK_CONNECTIVITY
                        - VERIFICATION_CHECK_RECORD_COUNTS
                        - VERIFICATION_CHECK_SCHEMA_PRESENCE
                        - VERIFICATION_CHECK_INTEGRITY
                        - VERIFICATION_CHECK_QUERYABILITY
                    type: string
                    format: enum
                passed:
                    type: boolean
                severity:
                    enum:
                        - SEVERITY_UNSPECIFIED
                        - SEVERITY_INFO
                        - SEVERITY_WARNING
                        - SEVERITY_CRITICAL
                    type: string
                    format: enum
                message:
                    type: string
                discrepancies:
                    type: array
                    items:
                        $ref: '#/components/schemas/Discrepancy'
                duration:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
        Checksum:
            type: object
            properties:
                algorithm:
                    enum:
                        - CHECKSUM_ALGORITHM_UNSPECIFIED
                        - CHECKSUM_ALGORITHM_SHA256
                        - CHECKSUM_ALGORITHM_CRC32C
                        - CHECKSUM_ALGORITHM_BLAKE3
                    type: string
                    format: enum
                value:
                    type: string
            description: Checksum of an artifact, recorded at write time and re-verified before any restore.
        ComponentHealth:
            type: object
            properties:
                name:
                    type: string
                    description: Component name, e.g. "metadb", "tsdb", "objstore", "plugin:postgresql".
                status:
                    enum:
                        - SERVICE_HEALTH_UNSPECIFIED
                        - SERVICE_HEALTH_HEALTHY
                        - SERVICE_HEALTH_DEGRADED
                        - SERVICE_HEALTH_UNHEALTHY
                    type: string
                    format: enum
                message:
                    type: string
                latency:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
        ConnectionSpec:
            type: object
            properties:
                username:
                    type: string
                password:
                    type: string
                database:
                    type: string
                tls:
                    $ref: '#/components/schemas/TLSSettings'
                options:
                    type: object
                    additionalProperties:
                        type: string
                shared_directory:
                    allOf:
                        - $ref: '#/components/schemas/SharedDirectory'
                    description: |-
                        Where this instance's backup files are written, and where this control plane sees the same
                         directory. Required only by an engine whose backup tooling produces a file on the database
                         server rather than a stream, which the plugin declares on the method (ADR-0026). Fleetward
                         refuses to back up such an instance without it, rather than discovering the gap at 02:00.
            description: |-
                ConnectionSpec carries credentials inbound only. No read API ever returns them: the secret is
                 write-only from the API's perspective (ADR-0009).
        CreateEnvironmentRequest:
            type: object
            properties:
                name:
                    type: string
                description:
                    type: string
                is_production:
                    type: boolean
        CreateEnvironmentResponse:
            type: object
            properties:
                environment:
                    $ref: '#/components/schemas/Environment'
        CreateInstanceRequest:
            type: object
            properties:
                environment_id:
                    type: string
                name:
                    type: string
                engine_type:
                    type: string
                host:
                    type: string
                port:
                    type: integer
                    format: int32
                connection:
                    $ref: '#/components/schemas/ConnectionSpec'
                labels:
                    type: object
                    additionalProperties:
                        type: string
        CreateInstanceResponse:
            type: object
            properties:
                instance:
                    $ref: '#/components/schemas/Instance'
        CreateScheduleRequest:
            type: object
            properties:
                instance_id:
                    type: string
                kind:
                    enum:
                        - JOB_KIND_UNSPECIFIED
                        - JOB_KIND_BACKUP
                        - JOB_KIND_VERIFY
                        - JOB_KIND_RESTORE
                        - JOB_KIND_DISCOVERY
                        - JOB_KIND_METRICS
                        - JOB_KIND_OBSERVE
                    type: string
                    format: enum
                cron_expression:
                    type: string
                timezone:
                    type: string
                    description: Defaults to UTC when empty.
                method_id:
                    type: string
                options:
                    type: object
                    additionalProperties:
                        type: string
                verify_policy:
                    enum:
                        - VERIFY_POLICY_UNSPECIFIED
                        - VERIFY_POLICY_ALWAYS
                        - VERIFY_POLICY_SAMPLED
                        - VERIFY_POLICY_MANUAL
                    type: string
                    format: enum
                verify_sample_percent:
                    type: integer
                    format: int32
                retention_days:
                    type: integer
                    format: int32
                expected_cron:
                    type: string
                    description: |-
                        See Schedule.expected_cron. Optional: a schedule with no expectation still collects history,
                         and adherence reports that nothing was declared rather than guessing.
                expected_grace_minutes:
                    type: integer
                    format: int32
        CreateScheduleResponse:
            type: object
            properties:
                schedule:
                    $ref: '#/components/schemas/Schedule'
        DatabaseInfo:
            type: object
            properties:
                name:
                    type: string
                size_bytes:
                    type: string
                owner:
                    type: string
                encoding:
                    type: string
                collation:
                    type: string
                object_count:
                    type: string
                    description: Tables, collections, or the engine's nearest equivalent.
                is_system:
                    type: boolean
                    description: System or internal database, which the UI de-emphasizes and backups usually skip.
        DeleteInstanceResponse:
            type: object
            properties: {}
        DeleteScheduleResponse:
            type: object
            properties: {}
        DiscoverInstanceRequest:
            type: object
            properties:
                instance_id:
                    type: string
        DiscoverInstanceResponse:
            type: object
            properties:
                server:
                    $ref: '#/components/schemas/ServerInfo'
                databases:
                    type: array
                    items:
                        $ref: '#/components/schemas/DatabaseInfo'
                topology:
                    $ref: '#/components/schemas/Topology'
        Discrepancy:
            type: object
            properties:
                database:
                    type: string
                object_name:
                    type: string
                expected:
                    type: string
                actual:
                    type: string
                detail:
                    type: string
        Environment:
            type: object
            properties:
                id:
                    type: string
                tenant_id:
                    type: string
                name:
                    type: string
                description:
                    type: string
                is_production:
                    type: boolean
                    description: Marks production, which core uses to require stronger confirmation on destructive actions.
                created_at:
                    type: string
                    format: date-time
        GetBackupAdherenceResponse:
            type: object
            properties:
                instances:
                    type: array
                    items:
                        $ref: '#/components/schemas/InstanceAdherence'
        GetBackupResponse:
            type: object
            properties:
                backup:
                    $ref: '#/components/schemas/Backup'
                manifest:
                    $ref: '#/components/schemas/SourceManifest'
        GetHealthResponse:
            type: object
            properties:
                status:
                    enum:
                        - SERVICE_HEALTH_UNSPECIFIED
                        - SERVICE_HEALTH_HEALTHY
                        - SERVICE_HEALTH_DEGRADED
                        - SERVICE_HEALTH_UNHEALTHY
                    type: string
                    format: enum
                components:
                    type: array
                    items:
                        $ref: '#/components/schemas/ComponentHealth'
        GetInstanceResponse:
            type: object
            properties:
                instance:
                    $ref: '#/components/schemas/Instance'
                capabilities:
                    allOf:
                        - $ref: '#/components/schemas/Capabilities'
                    description: |-
                        Capabilities of the plugin serving this instance. The UI renders its tabs from this, which is
                         how a capability-adaptive detail view stays engine-agnostic.
                server:
                    $ref: '#/components/schemas/ServerInfo'
                databases:
                    type: array
                    items:
                        $ref: '#/components/schemas/DatabaseInfo'
                topology:
                    $ref: '#/components/schemas/Topology'
        GetPITRWindowResponse:
            type: object
            properties:
                window:
                    $ref: '#/components/schemas/PITRWindow'
        GetScheduleResponse:
            type: object
            properties:
                schedule:
                    $ref: '#/components/schemas/Schedule'
        GetVerificationResponse:
            type: object
            properties:
                verification:
                    $ref: '#/components/schemas/Verification'
        GetVersionResponse:
            type: object
            properties:
                version:
                    type: string
                commit:
                    type: string
                build_date:
                    type: string
                go_version:
                    type: string
                contract_version:
                    type: string
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        HealthSignal:
            type: object
            properties:
                name:
                    type: string
                severity:
                    enum:
                        - SEVERITY_UNSPECIFIED
                        - SEVERITY_INFO
                        - SEVERITY_WARNING
                        - SEVERITY_CRITICAL
                    type: string
                    format: enum
                message:
                    type: string
                value:
                    type: number
                    format: double
                unit:
                    type: string
        HealthStatus:
            type: object
            properties:
                state:
                    enum:
                        - HEALTH_STATE_UNSPECIFIED
                        - HEALTH_STATE_UP
                        - HEALTH_STATE_DEGRADED
                        - HEALTH_STATE_DOWN
                        - HEALTH_STATE_UNKNOWN
                    type: string
                    format: enum
                message:
                    type: string
                latency:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: Round-trip latency of the health probe itself.
                signals:
                    type: array
                    items:
                        $ref: '#/components/schemas/HealthSignal'
                engine_version:
                    type: string
                error:
                    allOf:
                        - $ref: '#/components/schemas/PluginError'
                    description: |-
                        Set when the instance could not be reached. Accompanies HEALTH_STATE_DOWN rather than
                         replacing it.
        Instance:
            type: object
            properties:
                id:
                    type: string
                tenant_id:
                    type: string
                environment_id:
                    type: string
                name:
                    type: string
                engine_type:
                    type: string
                engine_version:
                    type: string
                host:
                    type: string
                port:
                    type: integer
                    format: int32
                health:
                    enum:
                        - HEALTH_STATE_UNSPECIFIED
                        - HEALTH_STATE_UP
                        - HEALTH_STATE_DEGRADED
                        - HEALTH_STATE_DOWN
                        - HEALTH_STATE_UNKNOWN
                    type: string
                    format: enum
                last_seen_at:
                    type: string
                    format: date-time
                labels:
                    type: object
                    additionalProperties:
                        type: string
                created_at:
                    type: string
                    format: date-time
                backup_summary:
                    allOf:
                        - $ref: '#/components/schemas/BackupSummary'
                    description: |-
                        Deprecated: never populated. It was declared for an estate grid that did not exist yet, and by
                         the time one did, GetBackupAdherence answered the same question better: it carries the verdict
                         as well as the backup, and it reports an instance nobody has declared anything for, which this
                         field cannot express. Read GetBackupAdherence instead. Removing this is a breaking change and
                         leaving it silent was a lie, so it says so here.
        InstanceAdherence:
            type: object
            properties:
                instance_id:
                    type: string
                instance_name:
                    type: string
                environment_id:
                    type: string
                engine_type:
                    type: string
                state:
                    enum:
                        - ADHERENCE_STATE_UNSPECIFIED
                        - ADHERENCE_STATE_ADHERENT
                        - ADHERENCE_STATE_MISSED
                        - ADHERENCE_STATE_UNPROVEN
                        - ADHERENCE_STATE_FAILED
                        - ADHERENCE_STATE_NOT_DECLARED
                    type: string
                    format: enum
                expected_cron:
                    type: string
                    description: The declaration, echoed so a reader can see what they are being held to.
                timezone:
                    type: string
                expected_grace_minutes:
                    type: integer
                    format: int32
                expected_by:
                    type: string
                    description: |-
                        The most recent instant a backup was supposed to have happened by, and the deadline the grace
                         period put on it.
                    format: date-time
                deadline:
                    type: string
                    format: date-time
                satisfied_by:
                    allOf:
                        - $ref: '#/components/schemas/Backup'
                    description: The backup that satisfied the window, when one did.
                latest_backup:
                    allOf:
                        - $ref: '#/components/schemas/Backup'
                    description: |-
                        The most recent backup of any kind, satisfying or not. Populated even when state is MISSED,
                         because "the last one was nine days ago" is the useful part of a miss.
                caveats:
                    type: array
                    items:
                        type: string
                    description: |-
                        What weakens this answer, in a sentence a human can act on: evidence that cannot report an
                         outcome, an identity that will not survive a rename, a timestamp that may be out by an hour.
                         Empty when the answer rests on nothing weaker than a backup Fleetward took itself.
            description: InstanceAdherence is the gap between what was declared and what was detected, for one instance.
        Job:
            type: object
            properties:
                id:
                    type: string
                tenant_id:
                    type: string
                instance_id:
                    type: string
                schedule_id:
                    type: string
                    description: Empty for a job a human triggered directly.
                kind:
                    enum:
                        - JOB_KIND_UNSPECIFIED
                        - JOB_KIND_BACKUP
                        - JOB_KIND_VERIFY
                        - JOB_KIND_RESTORE
                        - JOB_KIND_DISCOVERY
                        - JOB_KIND_METRICS
                        - JOB_KIND_OBSERVE
                    type: string
                    format: enum
                state:
                    enum:
                        - JOB_STATE_UNSPECIFIED
                        - JOB_STATE_PENDING
                        - JOB_STATE_RUNNING
                        - JOB_STATE_SUCCEEDED
                        - JOB_STATE_FAILED
                        - JOB_STATE_CANCELED
                    type: string
                    format: enum
                scheduled_for:
                    type: string
                    format: date-time
                lease_owner:
                    type: string
                    description: |-
                        Identifies the process holding the lease, as <hostname>/<pid>/<process-uuid>. The uuid is what
                         keeps a restarted process on a recycled pid from looking like its own predecessor.
                lease_expires_at:
                    type: string
                    format: date-time
                heartbeat_at:
                    type: string
                    format: date-time
                attempts:
                    type: integer
                    format: int32
                started_at:
                    type: string
                    format: date-time
                finished_at:
                    type: string
                    format: date-time
                error_message:
                    type: string
                created_at:
                    type: string
                    format: date-time
            description: |-
                Job is one unit of work the scheduler leases and runs. Every field after `state` exists to answer
                 a question after the fact, which is the whole reason jobs are rows rather than goroutines.
        ListBackupsResponse:
            type: object
            properties:
                backups:
                    type: array
                    items:
                        $ref: '#/components/schemas/Backup'
                next_page_token:
                    type: string
                total_size:
                    type: integer
                    format: int32
        ListEnvironmentsResponse:
            type: object
            properties:
                environments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Environment'
                next_page_token:
                    type: string
        ListInstancesResponse:
            type: object
            properties:
                instances:
                    type: array
                    items:
                        $ref: '#/components/schemas/Instance'
                next_page_token:
                    type: string
                total_size:
                    type: integer
                    format: int32
        ListJobsResponse:
            type: object
            properties:
                jobs:
                    type: array
                    items:
                        $ref: '#/components/schemas/Job'
        ListPluginsResponse:
            type: object
            properties:
                plugins:
                    type: array
                    items:
                        $ref: '#/components/schemas/PluginInfo'
        ListPrincipalsForInstanceResponse:
            type: object
            properties:
                principals:
                    type: array
                    items:
                        $ref: '#/components/schemas/Principal'
                model:
                    enum:
                        - PRINCIPAL_MODEL_UNSPECIFIED
                        - PRINCIPAL_MODEL_USERS
                        - PRINCIPAL_MODEL_USERS_AND_ROLES
                        - PRINCIPAL_MODEL_USERS_AND_GRANTS
                        - PRINCIPAL_MODEL_ACL
                        - PRINCIPAL_MODEL_NONE
                    type: string
                    format: enum
        ListSchedulesResponse:
            type: object
            properties:
                schedules:
                    type: array
                    items:
                        $ref: '#/components/schemas/Schedule'
        ManifestEntry:
            type: object
            properties:
                database:
                    type: string
                object_name:
                    type: string
                    description: Table, collection, keyspace, or key pattern.
                record_count:
                    type: string
                    description: Rows, documents, or keys.
                size_bytes:
                    type: string
                checksum:
                    type: string
                    description: Optional per-object content checksum, when the engine can produce one cheaply.
                count_may_have_drifted:
                    type: boolean
                    description: |-
                        The count could not be pinned to the artifact's own consistency point, because the object was
                         written to while the backup ran. A later mismatch is then drift rather than data loss, and is
                         reported as INCONCLUSIVE rather than FAILED (ADR-0022). The default — false — means exact, so
                         a manifest from a plugin that counts inside the snapshot it dumps keeps its meaning.
        MethodOption:
            type: object
            properties:
                name:
                    type: string
                display_name:
                    type: string
                description:
                    type: string
                type:
                    enum:
                        - OPTION_TYPE_UNSPECIFIED
                        - OPTION_TYPE_STRING
                        - OPTION_TYPE_INT
                        - OPTION_TYPE_BOOL
                        - OPTION_TYPE_ENUM
                        - OPTION_TYPE_DURATION
                    type: string
                    format: enum
                default_value:
                    type: string
                required:
                    type: boolean
                allowed_values:
                    type: array
                    items:
                        type: string
                    description: Populated when type is OPTION_TYPE_ENUM.
            description: |-
                MethodOption describes one tunable of a backup method so the UI can render a form without
                 knowing anything about the engine.
        MetricDescriptor:
            type: object
            properties:
                name:
                    type: string
                    description: OpenTelemetry semantic-convention name, e.g. "db.client.connection.count".
                type:
                    enum:
                        - METRIC_TYPE_UNSPECIFIED
                        - METRIC_TYPE_GAUGE
                        - METRIC_TYPE_SUM
                        - METRIC_TYPE_UP_DOWN_COUNTER
                    type: string
                    format: enum
                unit:
                    type: string
                    description: UCUM unit, e.g. "1", "By", "s".
                description:
                    type: string
                attribute_keys:
                    type: array
                    items:
                        type: string
                    description: Attribute keys this metric carries.
        Node:
            type: object
            properties:
                id:
                    type: string
                host:
                    type: string
                port:
                    type: integer
                    format: int32
                role:
                    enum:
                        - NODE_ROLE_UNSPECIFIED
                        - NODE_ROLE_PRIMARY
                        - NODE_ROLE_REPLICA
                        - NODE_ROLE_ARBITER
                        - NODE_ROLE_ROUTER
                        - NODE_ROLE_STANDALONE
                    type: string
                    format: enum
                state:
                    type: string
                replication_lag_seconds:
                    type: number
                    description: Populated only when Capabilities.supports_replication_lag is true.
                    format: double
                is_self:
                    type: boolean
        ObjectRef:
            type: object
            properties:
                bucket:
                    type: string
                key:
                    type: string
            description: |-
                ObjectRef locates an artifact in object storage. Plugins use it for identification and manifest
                 bookkeeping; actual transfer happens through PresignedURL so that no storage credential ever
                 reaches a plugin (ADR-0007).
        ObserveBackupHistoryRequest:
            type: object
            properties:
                instance_id:
                    type: string
        ObserveBackupHistoryResponse:
            type: object
            properties:
                discovered:
                    type: integer
                    description: Records the engine reported that Fleetward had not already recorded.
                    format: int32
                updated:
                    type: integer
                    description: |-
                        Records that matched a backup already known, and updated it rather than duplicating it. A
                         healthy estate settles at discovered = 0 and updated = a handful (ADR-0027).
                    format: int32
                watermark:
                    type: string
                    description: |-
                        The instant the newest evidence read in this poll finished at, which is where the next poll
                         resumes from.
                    format: date-time
        ObservedEvidence:
            type: object
            properties:
                source_description:
                    type: string
                    description: The source, in the engine's own vocabulary, e.g. "msdb.dbo.backupset".
                reports_outcome:
                    type: boolean
                    description: The source distinguishes success from failure. When false, `state` is UNKNOWN by construction.
                identity_is_engine_assigned:
                    type: boolean
                    description: The identity came from the engine, so a moved or renamed artifact stays one backup.
                completed_at_is_approximate:
                    type: boolean
                    description: |-
                        The finish time could not be converted to UTC with the offset in force on the day, so it may
                         be out by a daylight-saving transition.
                observed_at:
                    type: string
                    format: date-time
            description: |-
                ObservedEvidence is what the source this backup was read from could establish, carried alongside
                 the backup so a reader is never left to assume. A directory listing proves a file arrived; it
                 does not prove the dump that wrote it completed.
        PITRBaseline:
            type: object
            properties:
                backup_id:
                    type: string
                taken_at:
                    type: string
                    format: date-time
                artifact:
                    $ref: '#/components/schemas/ObjectRef'
                method_id:
                    type: string
        PITRGap:
            type: object
            properties:
                range:
                    $ref: '#/components/schemas/TimeRange'
                reason:
                    type: string
        PITRWindow:
            type: object
            properties:
                available:
                    type: boolean
                    description: |-
                        False when the engine or configuration does not currently support PITR — for example WAL
                         archiving is off. The UI explains why using the reason field rather than showing an empty
                         timeline.
                unavailable_reason:
                    type: string
                earliest:
                    type: string
                    format: date-time
                latest:
                    type: string
                    format: date-time
                gaps:
                    type: array
                    items:
                        $ref: '#/components/schemas/PITRGap'
                    description: Periods inside [earliest, latest] that cannot actually be recovered to.
                baselines:
                    type: array
                    items:
                        $ref: '#/components/schemas/PITRBaseline'
                granularity:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: Smallest resolvable recovery interval.
        PasswordPolicy:
            type: object
            properties:
                min_length:
                    type: integer
                    format: int32
                min_character_classes:
                    type: integer
                    description: Minimum number of distinct classes — uppercase, lowercase, digit, symbol — that must appear.
                    format: int32
                symbol_alphabet:
                    type: string
                    description: Symbols this engine accepts, if its own set is narrower than core's. Empty keeps core's.
            description: |-
                PasswordPolicy is what an engine will accept as a generated sandbox password.

                 Core generates the sandbox identity and the plugin's template places it (ADR-0020). Some images
                 also validate it: mcr.microsoft.com/mssql/server exits rather than start when the password it is
                 handed carries fewer than three of the four character classes. Declaring the rule lets core
                 satisfy it by construction; leaving it empty keeps core's default generator unchanged.
        PluginError:
            type: object
            properties:
                code:
                    enum:
                        - ERROR_CODE_UNSPECIFIED
                        - ERROR_CODE_CONNECTION_FAILED
                        - ERROR_CODE_AUTHENTICATION_FAILED
                        - ERROR_CODE_PERMISSION_DENIED
                        - ERROR_CODE_UNSUPPORTED
                        - ERROR_CODE_INVALID_ARGUMENT
                        - ERROR_CODE_TOOL_NOT_FOUND
                        - ERROR_CODE_TOOL_FAILED
                        - ERROR_CODE_OBJECT_STORE_FAILED
                        - ERROR_CODE_TIMEOUT
                        - ERROR_CODE_CANCELED
                        - ERROR_CODE_INTERNAL
                    type: string
                    format: enum
                message:
                    type: string
                    description: |-
                        Human-readable message. MUST NOT contain credentials, connection strings with passwords, or
                         presigned URL signatures.
                details:
                    type: object
                    additionalProperties:
                        type: string
                retryable:
                    type: boolean
                    description: True when core may usefully retry the same call.
            description: |-
                PluginError carries a structured failure from a plugin. Plugins should populate this rather than
                 returning bare gRPC status strings, so core can classify retryable failures without parsing text.
        PluginInfo:
            type: object
            properties:
                engine_type:
                    type: string
                capabilities:
                    $ref: '#/components/schemas/Capabilities'
                state:
                    enum:
                        - PLUGIN_STATE_UNSPECIFIED
                        - PLUGIN_STATE_STARTING
                        - PLUGIN_STATE_READY
                        - PLUGIN_STATE_UNHEALTHY
                        - PLUGIN_STATE_FAILED
                        - PLUGIN_STATE_STOPPED
                    type: string
                    format: enum
                message:
                    type: string
                missing_tools:
                    type: array
                    items:
                        type: string
                    description: |-
                        Tools declared as required that are missing on this host. A non-empty list means backups using
                         the affected methods will fail, so core surfaces it before a schedule fires.
                restart_count:
                    type: integer
                    format: int32
        Principal:
            type: object
            properties:
                name:
                    type: string
                kind:
                    enum:
                        - PRINCIPAL_KIND_UNSPECIFIED
                        - PRINCIPAL_KIND_USER
                        - PRINCIPAL_KIND_ROLE
                        - PRINCIPAL_KIND_GROUP
                        - PRINCIPAL_KIND_SERVICE
                    type: string
                    format: enum
                can_login:
                    type: boolean
                is_superuser:
                    type: boolean
                    description: Holds unrestricted or near-unrestricted rights. The UI flags these prominently.
                is_system:
                    type: boolean
                member_of:
                    type: array
                    items:
                        type: string
                    description: Names of roles or groups this principal is a member of.
                privileges:
                    type: array
                    items:
                        $ref: '#/components/schemas/Privilege'
                password_expires_at:
                    type: string
                    format: date-time
                last_login_at:
                    type: string
                    format: date-time
                attributes:
                    type: object
                    additionalProperties:
                        type: string
        Privilege:
            type: object
            properties:
                scope:
                    type: string
                    description: |-
                        What the privilege applies to, as "type:identifier", e.g. "database:app",
                         "table:public.users", "key:cache:*". Rendered as an opaque string by the UI.
                action:
                    type: string
                    description: The permitted action in the engine's own vocabulary, e.g. "SELECT", "readWrite", "+get".
                grantable:
                    type: boolean
                    description: The principal may grant this privilege onward.
                granted_by:
                    type: string
        RunBackupRequest:
            type: object
            properties:
                instance_id:
                    type: string
                method_id:
                    type: string
                    description: Empty selects the plugin's default method.
                options:
                    type: object
                    additionalProperties:
                        type: string
                databases:
                    type: array
                    items:
                        type: string
                verify_on_completion:
                    type: boolean
                    description: Run verification as soon as the backup completes, overriding the instance's policy.
        RunBackupResponse:
            type: object
            properties:
                backup_id:
                    type: string
                job_id:
                    type: string
        RunVerificationRequest:
            type: object
            properties:
                backup_id:
                    type: string
                checks:
                    type: array
                    items:
                        enum:
                            - VERIFICATION_CHECK_UNSPECIFIED
                            - VERIFICATION_CHECK_CONNECTIVITY
                            - VERIFICATION_CHECK_RECORD_COUNTS
                            - VERIFICATION_CHECK_SCHEMA_PRESENCE
                            - VERIFICATION_CHECK_INTEGRITY
                            - VERIFICATION_CHECK_QUERYABILITY
                        type: string
                        format: enum
                    description: Checks to run. Empty runs every check the plugin supports.
        RunVerificationResponse:
            type: object
            properties:
                verification_id:
                    type: string
                job_id:
                    type: string
        SandboxTemplate:
            type: object
            properties:
                image_repository:
                    type: string
                    description: Image repository without a tag, e.g. "postgres".
                default_tag:
                    type: string
                    description: Tag to use when the source instance's version cannot be matched, e.g. "16".
                tag_template:
                    type: string
                    description: |-
                        Go text/template evaluated with the discovered engine version to produce a tag, e.g.
                         "{{ .Major }}". Empty means always use default_tag.
                env:
                    type: object
                    additionalProperties:
                        type: string
                container_port:
                    type: integer
                    format: int32
                readiness_command:
                    type: array
                    items:
                        type: string
                    description: Command run inside the container to decide readiness, e.g. ["pg_isready", "-U", "postgres"].
                readiness_timeout:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                command:
                    type: array
                    items:
                        type: string
                min_disk_bytes:
                    type: string
                    description: Minimum tmpfs/volume size hint in bytes for the sandbox data directory.
                shared_directory:
                    type: string
                    description: |-
                        Path inside the container at which core mounts a directory the plugin can also read and write,
                         for engines that hand their artifact over as a file (ADR-0026). Core reports both names for it
                         in the sandbox's Credentials.shared_directory. Empty for engines that stream.
                fixed_username:
                    type: string
                    description: |-
                        The administrative account this image always creates and cannot be told to rename, e.g. "sa".
                         Core renders {{ .Username }} to it instead of generating a name, and still generates the
                         password. Empty keeps the generated username, which is the behaviour ADR-0020 describes.
                password_policy:
                    allOf:
                        - $ref: '#/components/schemas/PasswordPolicy'
                    description: |-
                        Complexity the image enforces on the password it is given. An image that refuses to start on a
                         weak password fails in the worst possible way — rarely, and at provisioning time — so the
                         policy is declared rather than discovered.
            description: |-
                SandboxTemplate tells core how to stand up a throwaway instance of this engine for verification.
                 Keeping it here — rather than in a core lookup table — is what allows a new engine to arrive as a
                 plugin with no core change.
        Schedule:
            type: object
            properties:
                id:
                    type: string
                tenant_id:
                    type: string
                instance_id:
                    type: string
                kind:
                    enum:
                        - JOB_KIND_UNSPECIFIED
                        - JOB_KIND_BACKUP
                        - JOB_KIND_VERIFY
                        - JOB_KIND_RESTORE
                        - JOB_KIND_DISCOVERY
                        - JOB_KIND_METRICS
                        - JOB_KIND_OBSERVE
                    type: string
                    format: enum
                cron_expression:
                    type: string
                    description: Standard five-field cron expression, interpreted in `timezone`.
                timezone:
                    type: string
                    description: |-
                        IANA location name, e.g. "Europe/Bucharest". A DBA writing "0 2 * * *" means 02:00 where the
                         server is, which is a different UTC instant in summer than in winter.
                method_id:
                    type: string
                    description: Empty selects the plugin's default backup method.
                options:
                    type: object
                    additionalProperties:
                        type: string
                verify_policy:
                    enum:
                        - VERIFY_POLICY_UNSPECIFIED
                        - VERIFY_POLICY_ALWAYS
                        - VERIFY_POLICY_SAMPLED
                        - VERIFY_POLICY_MANUAL
                    type: string
                    format: enum
                verify_sample_percent:
                    type: integer
                    description: Only consulted when verify_policy is SAMPLED.
                    format: int32
                retention_days:
                    type: integer
                    format: int32
                expected_cron:
                    type: string
                    description: |-
                        What a backup of this instance is supposed to look like, declared rather than inferred.

                         On an OBSERVE schedule `cron_expression` says how often to go and look; this says how often a
                         backup is supposed to have happened, and how late is still acceptable. Inferring the second
                         from the observed rhythm would answer "is this normal for you" instead of "is this what you
                         asked for", and the second question is the product.
                expected_grace_minutes:
                    type: integer
                    format: int32
                is_enabled:
                    type: boolean
                next_run_at:
                    type: string
                    description: The clock. Always UTC on the wire and in storage, computed in `timezone`.
                    format: date-time
                last_run_at:
                    type: string
                    format: date-time
                created_at:
                    type: string
                    format: date-time
            description: |-
                Schedule is a recurring intent. It is not a run: the scheduler materializes it into a Job when
                 next_run_at falls due, and the job carries a snapshot of these parameters so that editing a
                 schedule never rewrites what an in-flight run was asked to do.
        ServerInfo:
            type: object
            properties:
                engine_type:
                    type: string
                version:
                    type: string
                    description: Normalized semver where possible, e.g. "16.2".
                version_string:
                    type: string
                    description: Raw version string as the engine reports it.
                uptime:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                cluster_name:
                    type: string
                data_directory:
                    type: string
                read_only:
                    type: boolean
                attributes:
                    type: object
                    additionalProperties:
                        type: string
        SetScheduleEnabledRequest:
            type: object
            properties:
                schedule_id:
                    type: string
                enabled:
                    type: boolean
        SetScheduleEnabledResponse:
            type: object
            properties:
                schedule:
                    $ref: '#/components/schemas/Schedule'
        SharedDirectory:
            type: object
            properties:
                engine_path:
                    type: string
                    description: |-
                        The path as the engine sees it. Used verbatim in statements sent to the engine, so it must be
                         spelled the way that engine's platform spells a path.
                local_path:
                    type: string
                    description: The same directory as the process running the plugin sees it.
            description: |-
                SharedDirectory is one directory under the two names its two users know it by.

                 An engine that answers BACKUP with a file rather than a stream writes it somewhere the plugin has
                 no access to. The way out is a directory both sides can see — a mount, a share, or simply the
                 local disk when the plugin runs on the database host — which the two of them almost never call by
                 the same name. The plugin puts engine_path into the statements it sends and opens local_path
                 itself; the bytes are the same bytes.
        SourceManifest:
            type: object
            properties:
                captured_at:
                    type: string
                    format: date-time
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/ManifestEntry'
                total_objects:
                    type: string
                total_records:
                    type: string
                is_sampled:
                    type: boolean
                    description: The plugin could only sample, so count comparisons are indicative rather than exact.
            description: SourceManifest records what the source instance contained at backup time.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        TLSSettings:
            type: object
            properties:
                enabled:
                    type: boolean
                insecure_skip_verify:
                    type: boolean
                    description: Skips certificate verification. Intended for development only; core warns when it is set.
                ca_pem:
                    type: string
                    format: bytes
                client_cert_pem:
                    type: string
                    format: bytes
                client_key_pem:
                    type: string
                    format: bytes
                server_name:
                    type: string
        TestConnectionRequest:
            type: object
            properties:
                instance_id:
                    type: string
                connection:
                    allOf:
                        - $ref: '#/components/schemas/ConnectionSpec'
                    description: Supply to test credentials that have not been stored yet, during the add-instance wizard.
                engine_type:
                    type: string
                host:
                    type: string
                port:
                    type: integer
                    format: int32
        TestConnectionResponse:
            type: object
            properties:
                success:
                    type: boolean
                health:
                    $ref: '#/components/schemas/HealthStatus'
                message:
                    type: string
        TimeRange:
            type: object
            properties:
                start:
                    type: string
                    format: date-time
                end:
                    type: string
                    format: date-time
        Topology:
            type: object
            properties:
                nodes:
                    type: array
                    items:
                        $ref: '#/components/schemas/Node'
                is_standalone:
                    type: boolean
                    description: The engine reports a topology but this instance is standalone.
        Verification:
            type: object
            properties:
                id:
                    type: string
                backup_id:
                    type: string
                status:
                    enum:
                        - VERIFICATION_STATUS_UNSPECIFIED
                        - VERIFICATION_STATUS_VERIFIED
                        - VERIFICATION_STATUS_FAILED
                        - VERIFICATION_STATUS_INCONCLUSIVE
                    type: string
                    format: enum
                checks:
                    type: array
                    items:
                        $ref: '#/components/schemas/CheckResult'
                started_at:
                    type: string
                    format: date-time
                completed_at:
                    type: string
                    format: date-time
                duration:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                report:
                    type: string
                error_message:
                    type: string
tags:
    - name: BackupService
      description: |-
        BackupService covers backups, their verifications, and recovery windows. Every mutating RPC here
         requires at least the `dba` role and is recorded in the audit log.
    - name: InventoryService
      description: 'InventoryService manages the estate: environments, instances, and their connections.'
    - name: ScheduleService
      description: |-
        ScheduleService owns recurring intent: when a backup should run, in which timezone, and whether
         its verification is automatic. The scheduler turns each schedule into `jobs` rows and leases
         them; this service is how a human declares and inspects that intent (ADR-0013).
    - name: SystemService
      description: |-
        SystemService exposes liveness, readiness, and build information. It is the only service that is
         reachable without authentication, and it never returns tenant data.
