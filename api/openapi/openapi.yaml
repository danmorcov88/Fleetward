        get:
            tags:
                - BackupService
            description: |-
                GetBackupAdherence answers the question this product exists for: did every server's backup run
                 when it was supposed to, and did it succeed. It compares each instance's declared expectation
                 against the backups actually recorded, of either origin, and is computed on read — no verdict
                 is stored, so there is nothing that can go stale.
            operationId: BackupService_GetBackupAdherence
            parameters:
                - name: instance_id
                  in: query
                  description: |-
                    Restrict to one instance or one environment. Both empty reports the whole estate, which is the
                     question a DBA with fifty servers actually asks.
                  schema:
                    type: string
                - name: environment_id
                  in: query
                  schema:
                    type: string
                - name: problems_only
                  in: query
                  description: Report only instances that are not adherent.
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetBackupAdherenceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
