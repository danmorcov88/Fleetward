# Fleetward development stack.
#
# `docker compose up` brings up everything needed to run and evaluate Fleetward on a laptop:
# control plane, metadata database, metrics store, object storage, identity provider, and web UI.
#
# Every published port can be overridden from a .env file — see .env.example. Developer machines
# often already run a Postgres or a MinIO, and a port collision should not be the first thing a new
# contributor has to debug.
#
# THIS IS NOT A PRODUCTION CONFIGURATION. Every credential here is published in a public
# repository, TLS is disabled on every listener, and authentication is off by default. See
# SECURITY.md.

name: fleetward

services:
  # ---------------------------------------------------------------------------------------------
  # Metadata store (ADR-0005)
  # ---------------------------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetward
      POSTGRES_PASSWORD: fleetward
      POSTGRES_DB: fleetward
    ports:
      - "${FLEETWARD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -d and -U are both required: without them pg_isready reports the server as ready during the
      # initdb phase, and the control plane starts against a database that is about to restart.
      test: ["CMD-SHELL", "pg_isready -U fleetward -d fleetward"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------------------------
  # A monitored instance, so the quickstart has a second engine to point Fleetward at.
  #
  # It is here to be watched rather than to be depended on: nothing else in the stack talks to it,
  # and `docker compose up` without it is a complete Fleetward. It carries the shared-directory
  # volume because BACKUP DATABASE writes a file on the server's own filesystem, which the control
  # plane then reads from the same volume (ADR-0026).
  # ---------------------------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Development credentials, and they still have to satisfy the engine's complexity policy —
      # the container exits rather than starts on a password carrying fewer than three of the four
      # character classes.
      MSSQL_SA_PASSWORD: Fleetward-dev-1
      MSSQL_DB: fleetward_demo
    ports:
      - "${FLEETWARD_SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sandbox-share:/var/opt/mssql/fleetward
    healthcheck:
      # Connecting to the database rather than to master on purpose: the image creates it in a
      # setup pass that runs after the server is already listening.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S 127.0.0.1 -U sa -P \"$$MSSQL_SA_PASSWORD\" -d fleetward_demo -Q 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------------------------
  # Metrics store (ADR-0006)
  # ---------------------------------------------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.109.1
    command:
      - "--storageDataPath=/vm-data"
      - "--retentionPeriod=30d"
      - "--httpListenAddr=:8428"
    ports:
      - "${FLEETWARD_VM_PORT:-8428}:8428"
    volumes:
      - vm-data:/vm-data
    healthcheck:
      # 127.0.0.1, not localhost: VictoriaMetrics listens on IPv4 only, and localhost resolves to
      # ::1 first inside this image, which makes the probe fail against a perfectly healthy server.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------------------------
  # Backup artifact storage (ADR-0007)
  # ---------------------------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fleetward
      MINIO_ROOT_PASSWORD: fleetward-dev-secret
    ports:
      - "${FLEETWARD_MINIO_PORT:-9000}:9000"
      - "${FLEETWARD_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------------------------
  # Identity provider (ADR-0008)
  # ---------------------------------------------------------------------------------------------
  dex:
    image: dexidp/dex:v2.42.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "${FLEETWARD_DEX_PORT:-5556}:5556"
    volumes:
      - ./deploy/dev/dex/config.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5556/dex/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------------------------
  # Control plane
  # ---------------------------------------------------------------------------------------------
  fleetward:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        VERSION: dev
    ports:
      - "${FLEETWARD_HTTP_PORT:-8080}:8080"
      - "${FLEETWARD_GRPC_PORT:-9090}:9090"
    environment:
      FLEETWARD_ENV: development
      FLEETWARD_LOG_LEVEL: info
      FLEETWARD_LOG_FORMAT: text

      FLEETWARD_METADB_DSN: postgres://fleetward:fleetward@postgres:5432/fleetward?sslmode=disable
      FLEETWARD_METADB_AUTO_MIGRATE: "true"

      FLEETWARD_TSDB_REMOTE_WRITE_URL: http://victoriametrics:8428/api/v1/write
      FLEETWARD_TSDB_QUERY_URL: http://victoriametrics:8428

      FLEETWARD_OBJSTORE_ENDPOINT: minio:9000
      FLEETWARD_OBJSTORE_BUCKET: fleetward-backups
      FLEETWARD_OBJSTORE_ACCESS_KEY: fleetward
      FLEETWARD_OBJSTORE_SECRET_KEY: fleetward-dev-secret
      FLEETWARD_OBJSTORE_USE_SSL: "false"

      # Development key only. `fleetward-cli keygen` generates a real one; in production it belongs
      # in a mounted file, not in an environment variable.
      FLEETWARD_SECRETS_PROVIDER: aesgcm
      FLEETWARD_SECRETS_MASTER_KEY: "ZmxlZXR3YXJkLWRldmVsb3BtZW50LWtleS0zMmJ5dGU="

      FLEETWARD_PLUGINS_DIR: /app/plugins

      # Retention deletes the artifacts of backups Fleetward took that have outlived the
      # `--retention-days` their schedule declared. It never touches a backup Fleetward did not
      # take, and it never deletes an instance's last good one (docs/ops/retention.md).
      #
      # Only the interval differs from the shipped default here: one minute rather than one hour, so
      # that a sweep is observable in a development session instead of something you wait an hour to
      # see. It changes how often Fleetward looks, never how long a backup is kept.
      FLEETWARD_RETENTION_ENABLED: "true"
      FLEETWARD_RETENTION_INTERVAL: 1m
      FLEETWARD_RETENTION_MIN_KEEP: "1"
      FLEETWARD_RETENTION_MAX_PER_SWEEP: "500"

      # The control plane runs inside a container here, so a sandbox's published host port is not
      # reachable from it — 127.0.0.1 means something different on each side. Attaching sandboxes to
      # this stack's network instead lets the control plane address them by container name.
      FLEETWARD_SANDBOX_NETWORK: fleetward_default

      # An engine that writes its backup to its own filesystem hands it over through a directory
      # both sides can see (ADR-0026). The control plane is itself a container here, so a bind
      # mount would be resolved by the daemon against the host rather than against this container:
      # a named volume, mounted into both, is the only arrangement that works.
      FLEETWARD_SANDBOX_SHARED_DIR_VOLUME: fleetward_sandbox-share
      FLEETWARD_SANDBOX_SHARED_DIR_LOCAL: /app/share

      # Authorization is ON in the development stack, and that is deliberate.
      #
      # It used to be off, so the quickstart needed no login round trip. The cost of that was that
      # the enforcement nothing else in the product depends on was never exercised by anything —
      # not by a developer, not by the CI smoke test — which is the exact mechanism that once let
      # SECURITY.md claim an authorization layer that had never been built (ADR-0024).
      #
      # The credential below is the bootstrap token: configuration, never a database row, and
      # tenant-wide administrator. It is a known value in a file in a public repository, which is
      # fine for a stack you started on your own machine and is the reason a real installation
      # generates one and removes it after issuing a proper token. See docs/ops/authorization.md.
      FLEETWARD_AUTH_ENABLED: "true"
      FLEETWARD_AUTH_BOOTSTRAP_TOKEN: fwt_devbootstrap_0000000000000000
      # Fixed so that restarting the control plane does not sign the browser out mid-demo. A real
      # installation either sets its own or accepts that a restart means signing in again.
      FLEETWARD_AUTH_SESSION_KEY: ZGV2ZWxvcG1lbnQtb25seS1zZXNzaW9uLWtleS0zMmJ5dGVzIQ==
      FLEETWARD_AUTH_ISSUER_URL: http://dex:5556/dex
      FLEETWARD_AUTH_CLIENT_ID: fleetward
      FLEETWARD_AUTH_CLIENT_SECRET: fleetward-dev-secret
      FLEETWARD_AUTH_REDIRECT_URL: http://localhost:8080/api/v1/auth/callback
      # Dex is in the stack and nothing talks to it yet: OIDC arrives in B10, behind the spine B6
      # built. These settings are what it will read.
      FLEETWARD_AUTH_SKIP_ISSUER_VERIFICATION: "true"
    depends_on:
      postgres:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
      minio:
        condition: service_healthy
      dex:
        condition: service_healthy
    volumes:
      # Verification provisions throwaway containers of the engine being verified, so the control
      # plane drives the host's Docker daemon (ADR: SandboxProvider, Docker in MVP). This is a
      # development convenience with real privilege attached — a production deployment should use a
      # scoped socket proxy or the Kubernetes SandboxProvider instead.
      - /var/run/docker.sock:/var/run/docker.sock
      # The other half of the shared directory above: the control plane writes an artifact here and
      # a sandbox reads it from the same volume, mounted at whatever path its plugin declares.
      - sandbox-share:/app/share
    group_add:
      # The image runs unprivileged (see deploy/docker/Dockerfile), and the Docker socket grants
      # access by group. Which group differs by platform: inside a Docker Desktop VM the socket is
      # root:root, so group 0 is what opens it, while on a Linux host it is root:docker and the
      # host's docker GID is needed. The default makes the macOS quickstart work with no .env;
      # Linux and CI set FLEETWARD_DOCKER_GID — see .env.example.
      - "${FLEETWARD_DOCKER_GID:-0}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fleetward-cli", "health", "--server", "http://127.0.0.1:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------------------------
  # Web UI (ADR-0010)
  # ---------------------------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: ../deploy/docker/Dockerfile.web
    ports:
      - "${FLEETWARD_WEB_PORT:-3000}:3000"
    environment:
      FLEETWARD_API_URL: http://fleetward:8080
    volumes:
      # Source is mounted for hot reload; node_modules stays in the image so a host install for a
      # different platform cannot shadow it.
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts
    depends_on:
      fleetward:
        condition: service_started

volumes:
  postgres-data:
  sandbox-share:
  vm-data:
  minio-data:
