name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run of the same branch. Backup and conformance jobs are slow,
# and there is no value in finishing a run whose commit is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"

jobs:
  proto:
    name: Protobuf contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # buf breaking compares against main, which needs history rather than a shallow clone.
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint
        run: buf lint

      - name: Check formatting
        run: buf format --diff --exit-code

      # The plugin contract is a public interface that third-party plugins implement. A breaking
      # change to it must be a deliberate, reviewed act, not something that slips through review.
      - name: Detect breaking changes
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=origin/main'

      - name: Verify generated code is current
        run: |
          buf generate
          buf generate --template internal/storage/tsdb/prompb/buf.gen.yaml internal/storage/tsdb/prompb
          if ! git diff --exit-code -- api/gen api/openapi internal/storage/tsdb/prompb; then
            echo "::error::Generated code is out of date. Run 'make proto' and commit the result."
            exit 1
          fi

  lint:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest": a new golangci-lint release can add checks and turn CI red on a
          # commit that changed nothing. Bumping it is then a deliberate PR with its own diff.
          # The action major must match the config format — .golangci.yml is `version: "2"`, which
          # needs golangci-lint v2, which needs action v7 or newer.
          version: v2.12.2

  test:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      # Not -short: the plugin manager tests build real plugin binaries and drive them over
      # go-plugin. That path is the architecture, so it is exercised on every commit.
      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # The host tools the integration suite needs. Plugins orchestrate native tooling by design, so
      # the pg_dump backup test and the pg_restore verification test cannot mock them away — and
      # pg_dump refuses to dump a server newer than itself, which is why the client major is pinned
      # to the test server's. Without this step both tests skip, and a skipped merge gate is not a
      # merge gate.
      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version

      # A tool that talks to databases and has only been tested against mocks has not been tested
      # (ADR-0012). These spin real engines with testcontainers; the runner already has Docker.
      # They live in the same job so the required-check set stays stable.
      # 30 minutes rather than 20: every verification test stands up its own PostgreSQL and MinIO,
      # and slice A5 added a second database container per test to restore into.
      - name: Integration tests
        run: go test -race -tags=integration -timeout 30m ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # Plugin discovery is the one place where "works on my machine" is platform-shaped: Windows has no
  # executable permission bit, os.Stat reports 0666 for a compiled binary, and exec.Command resolves
  # through PATHEXT. A Unix-only predicate silently made every plugin undiscoverable there, which
  # also meant the conformance suite — this project's own merge gate for plugins — could not be run
  # locally on a Windows machine at all. This job is what keeps that from coming back.
  #
  # Deliberately not -short: the tests that build a real plugin binary and drive it over go-plugin
  # are exactly the ones that would have caught it, and -short skips them.
  #
  # Deliberately no -race and no integration tags: race coverage comes from the Linux job, and
  # testcontainers on a Windows runner is slow and flaky. This job answers one question — does the
  # process-launch path work on Windows — and nothing else.
  test-windows:
    name: Test Go (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: go test ./...

  # Every other job here guards code. This one guards the claims made about it — that a path named
  # in a layout tree exists, that a decision record carries its alternatives, that the set of jobs
  # the ruleset requires is the set this file defines. Those were checked by nobody, and seventeen
  # of them were false by the time anyone counted.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Same idiom as the protobuf codegen drift check: regenerate, and fail if the result differs
      # from what was committed. A generated file that is committed is one a reader of the
      # repository sees without running anything, which is the point of committing it.
      - name: Verify generated documentation is current
        run: |
          make docs
          if ! git diff --exit-code -- docs/; then
            echo "::error::Generated documentation is out of date. Run 'make docs' and commit."
            exit 1
          fi

      - name: Check documentation claims
        run: make docs-check

      # Renders the wiki without publishing it. Catches a document added to docs/ but not to the
      # wiki manifest — which would simply not appear once published — and any link that would 404
      # there, at the point where someone can still fix it.
      - name: Verify the wiki would publish
        run: go run ./tools/wikigen -out "$(mktemp -d)"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all binaries
        run: make build

      - name: Verify plugin binaries handshake
        run: |
          # A plugin run directly must refuse to start rather than hang: it is designed to be
          # launched by the plugin manager. This catches a plugin binary that was linked wrong.
          for binary in bin/plugins/*; do
            echo "checking $binary"
            if timeout 10 "$binary" >/dev/null 2>&1; then
              echo "::error::$binary exited zero when run directly; expected a handshake refusal"
              exit 1
            fi
          done

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    # Bounded deliberately rather than inheriting the six-hour default. Since slice B2 the suite
    # stands up SQL Server as well as PostgreSQL, which on a cold runner means pulling a further
    # 600 MB and paying for two container starts per end-to-end case. `make conformance` allows the
    # test binary 60 minutes; this covers that plus the pulls, and still fails the same day.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The shared suite is the merge gate for a plugin (ADR-0012, CLAUDE.md §4). It asserts the
      # contract against every plugin binary, which is what will later make a community-contributed
      # plugin trustworthy — so it belongs in CI rather than in a habit of running it locally.
      #
      # It gets its own job because it is the slowest thing here and it grows with every engine.
      # Keeping it out of Test Go means a failure names itself in the checks list.
      #
      # Since slice A6 the suite drives backup, restore and verification against real engines, so
      # it needs the same host tooling the integration tests do. Without it every Stage 1 case
      # skips, and a skipped merge gate is not a merge gate.
      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version

      - name: Conformance suite
        run: make conformance

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: Dev stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The control plane runs unprivileged and needs the Docker socket to provision verification
      # sandboxes. The socket is root:docker on a Linux runner, so the group has to be discovered
      # rather than assumed — the compose default of 0 is the macOS answer.
      - name: Grant the control plane access to the Docker socket
        run: echo "FLEETWARD_DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> .env

      # Stage 0's exit criterion is that `docker compose up` yields a healthy control plane with a
      # green /readyz. Asserting it here means it cannot quietly rot between releases.
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Check readiness
        run: |
          set -euo pipefail
          response=$(curl -fsS http://localhost:8080/readyz)
          echo "$response" | jq .
          status=$(echo "$response" | jq -r .status)
          if [ "$status" != "healthy" ]; then
            echo "::error::/readyz reported $status, expected healthy"
            exit 1
          fi

      - name: Check the web UI is served
        run: curl -fsS -o /dev/null http://localhost:3000

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
